name: Run OTP Script
on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files for debugging
        run: |
          echo "Files in repository:"
          ls -la
          echo "Current directory:"
          pwd

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp nest-asyncio requests

      - name: Run script with full output
        run: |
          python -u script.py
