name: Run OTP Script
on:
  workflow_dispatch:  # په لاسي ډول پیل کول

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # ۶ ساعته

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install aiohttp nest-asyncio requests

      - name: Run script
        run: |
          python script.py
